# Example Docker Compose for Frigate Notify Bridge (Standalone)
# For users without Home Assistant

version: "3.8"

services:
  frigate-notify-bridge:
    image: ghcr.io/LowkeyNEXT/frigate-notify-bridge:latest
    container_name: frigate-notify-bridge
    restart: unless-stopped
    ports:
      - "8199:8199"
    environment:
      # Required: Frigate connection
      FRIGATE_URL: "http://frigate:5000"
      # FRIGATE_USERNAME: ""  # Optional: if Frigate auth is enabled
      # FRIGATE_PASSWORD: ""

      # Required: MQTT connection (where Frigate publishes events)
      MQTT_HOST: "mqtt"
      MQTT_PORT: "1883"
      # MQTT_USERNAME: ""  # Optional
      # MQTT_PASSWORD: ""
      MQTT_TOPIC_PREFIX: "frigate"

      # Push notification provider (choose one):
      # Option A: Push Relay (recommended for Frigate Mobile app users)
      #   - End-to-end encrypted, no Firebase credentials required on your end
      #   - Get RELAY_BRIDGE_ID, RELAY_BRIDGE_SECRET, and RELAY_E2E_KEY during bridge setup
      PUSH_PROVIDER: "relay"
      RELAY_URL: "https://push.frigate-mobile.app"
      RELAY_BRIDGE_ID: "your-bridge-id"
      RELAY_BRIDGE_SECRET: "your-bridge-secret"
      RELAY_E2E_KEY: "64-character-hex-encoded-32-byte-key"  # openssl rand -hex 32

      # Option B: FCM (direct Firebase — requires your own Firebase project)
      # PUSH_PROVIDER: "fcm"
      # FCM_CREDENTIALS_FILE: "/config/firebase-credentials.json"

      # Option C: ntfy
      # PUSH_PROVIDER: "ntfy"
      # NTFY_URL: "https://ntfy.sh"
      # NTFY_TOPIC: "my-frigate-alerts"
      # NTFY_TOKEN: ""  # Optional: for authenticated topics

      # Option D: Pushover
      # PUSH_PROVIDER: "pushover"
      # PUSHOVER_USER_KEY: "your_user_key"
      # PUSHOVER_API_TOKEN: "your_api_token"

      # Optional: External URL for remote access pairing
      # EXTERNAL_URL: "https://your-domain.com:8199"

      # Admin token for Bridge Manager screen in the Frigate Mobile app
      # Generate with: openssl rand -hex 24
      # ADMIN_TOKEN: ""

      # Logging
      LOG_LEVEL: "INFO"

    volumes:
      # Mount config directory for Firebase credentials and device storage
      - ./config:/config

    # If Frigate and MQTT are on the same Docker network
    networks:
      - frigate_network

networks:
  frigate_network:
    external: true  # Use existing network from Frigate's compose
